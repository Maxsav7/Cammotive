# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm ci --ignore-scripts
    - name: Audit (production deps must be clean; dev exceptions need a reason + review date)
      run: npm run security:audit
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run security:secrets
    - run: npm run typecheck
    - name: Database migrations match db/schema.ts
      run: npm run db:check
    - run: npm run test:security
    - run: npm test
    - run: npm run test:vercel
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - name: Every page on desktop and phone (errors, layout, accessibility)
      run: npm run test:browser
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-results
        path: test-results/
        retention-days: 7
